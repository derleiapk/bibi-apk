name: Gerar APK do Bibi

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Montar o app (Capacitor)
        env:
          AI_URL: ${{ vars.AI_URL }}
          APP_KEY: ${{ vars.APP_KEY }}
        run: |
          mkdir -p app/www
          cp index.html app/www/index.html
          sed -i "s|__AI_URL__|${AI_URL}|g; s|__APP_KEY__|${APP_KEY}|g" app/www/index.html
          cd app
          npm init -y > /dev/null
          npm install @capacitor/core @capacitor/cli @capacitor/android
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.bibi.jogo",
            "appName": "Bibi",
            "webDir": "www",
            "android": { "allowMixedContent": false }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Ícone do app
        continue-on-error: true
        run: |
          if [ -f icon.png ]; then
            pip install --break-system-packages pillow > /dev/null || pip install pillow > /dev/null
            python3 - <<'EOF'
          from PIL import Image
          import os
          im = Image.open('icon.png').convert('RGBA')
          res = 'app/android/app/src/main/res'
          for d, n in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
              os.makedirs(f'{res}/mipmap-{d}', exist_ok=True)
              ic = im.resize((n, n), Image.LANCZOS)
              for name in ('ic_launcher.png', 'ic_launcher_round.png', 'ic_launcher_foreground.png'):
                  ic.save(f'{res}/mipmap-{d}/{name}')
          EOF
            rm -rf app/android/app/src/main/res/mipmap-anydpi-v26
          fi

      - name: Compilar APK
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then cp debug.keystore ~/.android/debug.keystore; fi
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../Bibi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Bibi-apk
          path: Bibi.apk
