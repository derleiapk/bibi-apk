name: Gerar APK do Bibi

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Montar o app (Capacitor)
        env:
          AI_URL: ${{ vars.AI_URL }}
          APP_KEY: ${{ vars.APP_KEY }}
        run: |
          mkdir -p app/www
          cp index.html app/www/index.html
          sed -i "s|__AI_URL__|${AI_URL}|g; s|__APP_KEY__|${APP_KEY}|g" app/www/index.html
          cd app
          npm init -y > /dev/null
          npm install @capacitor/core @capacitor/cli @capacitor/android
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.bibi.jogo",
            "appName": "Bibi",
            "webDir": "www",
            "android": { "allowMixedContent": false }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Ícone do app
        continue-on-error: true
        run: |
          if [ -f icon.png ]; then
            mkdir -p app/assets
            cp icon.png app/assets/icon-only.png
            cp icon.png app/assets/icon-foreground.png
            cd app
            npx --yes @capacitor/assets generate --android --iconBackgroundColor '#fde4ee'
          fi

      - name: Compilar APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../Bibi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Bibi-apk
          path: Bibi.apk
